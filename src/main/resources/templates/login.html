<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body th:replace="~{layouts/main :: layout(~{::title}, ~{::main})}">
    <main class="login-page">
        <div th:replace="~{fragments/navbar_guest :: navbar_guest}"></div>
        <div class="login-layout">
            <section class="login-card">
                <header class="login-card__header">
                    <h1 class="login-card__title">Login</h1>
                    <p class="login-card__subtitle">Welcome back! Sign in to your account.</p>
                </header>

                <form class="login-form" th:action="@{/login}" method="post">
                    <label class="form-field">
                        <span class="form-field__label">Username or email</span>
                        <input class="form-field__input" type="text" name="username" placeholder="example@example.com" autocomplete="email" />
                    </label>

                    <label class="form-field">
                        <span class="form-field__label">Password</span>
                        <div class="form-field__password">
                            <input class="form-field__input" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
                        </div>
                    </label>

                    <div class="recaptcha">
                        <div class="recaptcha__box">
                            <div class="recaptcha__left">
                                <div class="recaptcha__checkbox"></div>
                                <span class="recaptcha__text">I'm not a robot</span>
                            </div>
                            <div class="recaptcha__right">
                                <div class="recaptcha__logo"></div>
                                <span class="recaptcha__brand">reCAPTCHA</span>
                            </div>
                        </div>
                        <p class="recaptcha__meta">
                            <a class="recaptcha__meta-link" href="#">Privacy</a>
                            <span class="recaptcha__meta-dot">·</span>
                            <a class="recaptcha__meta-link" href="#">Terms</a>
                        </p>
                    </div>

                    <button class="login-submit" type="submit">Log in</button>

                    <div class="login-divider">
                        <span class="login-divider__line"></span>
                        <span class="login-divider__text">Or</span>
                        <span class="login-divider__line"></span>
                    </div>

                    <div class="social-auth">
                        <button class="social-auth__btn" type="button">
                            <span class="social-auth__icon"><img th:src="@{/images/google.png}" alt="" /></span> Continue with Google
                        </button>
                        <button class="social-auth__btn" type="button">
                            <span class="social-auth__icon"><img th:src="@{/images/linkedin.png}" alt="" /></span> Continue with LinkedIn
                        </button>
                        <button class="social-auth__btn" type="button">
                            <span class="social-auth__icon"><img th:src="@{/images/key.png}" alt="" /></span> Continue with SSO
                        </button>
                    </div>

                    <div class="login-help">
                        <span class="login-help__text">Having trouble logging in?</span>
                        <a class="login-help__link" href="#">Send magic link</a>
                    </div>

                    <footer class="login-footer">
                        <span>New here?</span>
                        <a class="login-footer__link" th:href="@{/register}">Sign up</a>.
                    </footer>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
